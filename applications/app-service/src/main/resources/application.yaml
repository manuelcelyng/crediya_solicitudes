server:
  port: ${SERVER_PORT:8081}
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: "solicitudes"
  devtools:
    add-properties: false
security:
  jwt:
    secret: ${JWT_KEY_SECRET:fQZJCefphgnEAnD9WlLBIQbpzV351d0mb3oGGsT6bvtaSqIZbTSId6wDwV3B1CbxEO7JlxQK6obNR9oUjDlYGg==}
app:
  issuer: ${JWT_ISSUER:http://localhost:8080}
  audience: "autenticacion"
logging:
  pattern:
    level: "%5p [${spring.application.name}] [cid:%X{correlationId}]"
  config: "${LOGGING_CONFIG_FILE:classpath:logback-spring.xml}"
  file:
    path: "${LOG_PATH:build/logs}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "*"
adapter:
  restconsumer:
    timeout: 5000
    baseurl: ${BASE_URL_MS_AUTH:http://localhost:8080}
  sqs:
    cambio-estado-sol:
      region: ${AWS_REGION:us-east-2}
      queueUrl: ${AWS_QUEUE:https://sqs.us-east-2.amazonaws.com/267259336936/solicitud-cambio-estado-sqs}
    validacion-automatica:
      region: ${AWS_REGION:us-east-2}
      queueUrl: ${AWS_QUEUE:https://sqs.us-east-2.amazonaws.com/267259336936/solicitud-cambio-estado-sqs}

resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
